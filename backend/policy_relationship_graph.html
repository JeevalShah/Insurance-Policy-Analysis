              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#E74C3C", "id": "RuleChange:RC-2026-01_WaterDamage.txt", "label": "RC-2026-01_WaterDamage", "shape": "dot", "size": 26, "title": "\n    \u003cdiv style=\"font-family: Arial, sans-serif; width: 320px; padding: 6px;\"\u003e\n        \u003cb style=\"font-size: 14px; color:#E74C3C\"\u003e[RULECHANGE]\u003c/b\u003e\u003cbr\u003e\n        \u003cb\u003eFile:\u003c/b\u003e RC-2026-01_WaterDamage.txt\u003cbr\u003e\n        \u003cb\u003eImpact / Risk:\u003c/b\u003e High\u003cbr\u003e\n        \u003chr style=\"border: 0.5px solid #ccc; margin: 6px 0;\"\u003e\n        \u003cb\u003eContent Excerpt:\u003c/b\u003e\u003cbr\u003e\n        \u003ci style=\"font-size: 11px; color: #555;\"\u003eRULE CHANGE NOTICE RC-2026-01 (WATER DAMAGE):\u003cbr\u003e        Pursuant to Section 12.1 and Clause 4.2, all residential and commercial property water damage claims require mandatory quarterly inspection reports.\u003cbr\u003e        Payout limits for structural flooding are capped at $50,000 max. Any claims without quarterly inspection logs shall be rejected.\u003c/i\u003e\n    \u003c/div\u003e\n    "}, {"color": "#E74C3C", "id": "RuleChange:RC-2026-02_AutoTowing.txt", "label": "RC-2026-02_AutoTowing", "shape": "dot", "size": 26, "title": "\n    \u003cdiv style=\"font-family: Arial, sans-serif; width: 320px; padding: 6px;\"\u003e\n        \u003cb style=\"font-size: 14px; color:#E74C3C\"\u003e[RULECHANGE]\u003c/b\u003e\u003cbr\u003e\n        \u003cb\u003eFile:\u003c/b\u003e RC-2026-02_AutoTowing.txt\u003cbr\u003e\n        \u003cb\u003eImpact / Risk:\u003c/b\u003e Medium\u003cbr\u003e\n        \u003chr style=\"border: 0.5px solid #ccc; margin: 6px 0;\"\u003e\n        \u003cb\u003eContent Excerpt:\u003c/b\u003e\u003cbr\u003e\n        \u003ci style=\"font-size: 11px; color: #555;\"\u003eRULE CHANGE NOTICE RC-2026-02 (AUTO TOWING CAPS):\u003cbr\u003e        Under Section 8.1, roadside recovery and emergency towing reimbursements are strictly capped at $100 per incident.\u003cbr\u003e        Third-party unauthorized towing services are strictly non-compliant and non-reimbursable under revised underwriting guidelines.\u003c/i\u003e\n    \u003c/div\u003e\n    "}, {"color": "#E74C3C", "id": "RuleChange:RC-2026-03_CyberMFA.txt", "label": "RC-2026-03_CyberMFA", "shape": "dot", "size": 26, "title": "\n    \u003cdiv style=\"font-family: Arial, sans-serif; width: 320px; padding: 6px;\"\u003e\n        \u003cb style=\"font-size: 14px; color:#E74C3C\"\u003e[RULECHANGE]\u003c/b\u003e\u003cbr\u003e\n        \u003cb\u003eFile:\u003c/b\u003e RC-2026-03_CyberMFA.txt\u003cbr\u003e\n        \u003cb\u003eImpact / Risk:\u003c/b\u003e Critical\u003cbr\u003e\n        \u003chr style=\"border: 0.5px solid #ccc; margin: 6px 0;\"\u003e\n        \u003cb\u003eContent Excerpt:\u003c/b\u003e\u003cbr\u003e\n        \u003ci style=\"font-size: 11px; color: #555;\"\u003eRULE CHANGE NOTICE RC-2026-03 (CYBER SECURITY HARDENING):\u003cbr\u003e        Referencing Paragraph 15.3, cyber liability coverage requires mandatory hardware-token multi-factor authentication (MFA) on administrator endpoints.\u003cbr\u003e        Bi-annual third-party penetration testing reports must be submitted to underwriters annually.\u003c/i\u003e\n    \u003c/div\u003e\n    "}, {"color": "#E74C3C", "id": "RuleChange:RC-2026-04_HealthPreExisting.txt", "label": "RC-2026-04_HealthPreExisting", "shape": "dot", "size": 26, "title": "\n    \u003cdiv style=\"font-family: Arial, sans-serif; width: 320px; padding: 6px;\"\u003e\n        \u003cb style=\"font-size: 14px; color:#E74C3C\"\u003e[RULECHANGE]\u003c/b\u003e\u003cbr\u003e\n        \u003cb\u003eFile:\u003c/b\u003e RC-2026-04_HealthPreExisting.txt\u003cbr\u003e\n        \u003cb\u003eImpact / Risk:\u003c/b\u003e Medium\u003cbr\u003e\n        \u003chr style=\"border: 0.5px solid #ccc; margin: 6px 0;\"\u003e\n        \u003cb\u003eContent Excerpt:\u003c/b\u003e\u003cbr\u003e\n        \u003ci style=\"font-size: 11px; color: #555;\"\u003eRULE CHANGE NOTICE RC-2026-04 (PRE-EXISTING WAITING PERIODS):\u003cbr\u003e        Amendment to Clause 9.4: The initial waiting period for pre-existing cardiovascular conditions is reduced from 24 months to 12 months.\u003cbr\u003e        Co-pay percentages remain static at 15% across network hospitals.\u003c/i\u003e\n    \u003c/div\u003e\n    "}, {"color": "#E74C3C", "id": "RuleChange:RC-2026-05_RoofDepreciation.txt", "label": "RC-2026-05_RoofDepreciation", "shape": "dot", "size": 26, "title": "\n    \u003cdiv style=\"font-family: Arial, sans-serif; width: 320px; padding: 6px;\"\u003e\n        \u003cb style=\"font-size: 14px; color:#E74C3C\"\u003e[RULECHANGE]\u003c/b\u003e\u003cbr\u003e\n        \u003cb\u003eFile:\u003c/b\u003e RC-2026-05_RoofDepreciation.txt\u003cbr\u003e\n        \u003cb\u003eImpact / Risk:\u003c/b\u003e High\u003cbr\u003e\n        \u003chr style=\"border: 0.5px solid #ccc; margin: 6px 0;\"\u003e\n        \u003cb\u003eContent Excerpt:\u003c/b\u003e\u003cbr\u003e\n        \u003ci style=\"font-size: 11px; color: #555;\"\u003eRULE CHANGE NOTICE RC-2026-05 (ROOF AGE DEPRECIATION):\u003cbr\u003e        Modifying Section 12.1 and Article 7: Roof replacement coverage for asphalt shingle roofs older than 15 years shall transition from Actual Replacement Value to Actual Cash Value (ACV).\u003c/i\u003e\n    \u003c/div\u003e\n    "}, {"color": "#E74C3C", "id": "RuleChange:RC-2026-06_SupplyChainDowntime.txt", "label": "RC-2026-06_SupplyChainDowntime", "shape": "dot", "size": 26, "title": "\n    \u003cdiv style=\"font-family: Arial, sans-serif; width: 320px; padding: 6px;\"\u003e\n        \u003cb style=\"font-size: 14px; color:#E74C3C\"\u003e[RULECHANGE]\u003c/b\u003e\u003cbr\u003e\n        \u003cb\u003eFile:\u003c/b\u003e RC-2026-06_SupplyChainDowntime.txt\u003cbr\u003e\n        \u003cb\u003eImpact / Risk:\u003c/b\u003e High\u003cbr\u003e\n        \u003chr style=\"border: 0.5px solid #ccc; margin: 6px 0;\"\u003e\n        \u003cb\u003eContent Excerpt:\u003c/b\u003e\u003cbr\u003e\n        \u003ci style=\"font-size: 11px; color: #555;\"\u003eRULE CHANGE NOTICE RC-2026-06 (BUSINESS INTERRUPTION WAITING PERIOD):\u003cbr\u003e        Modifying Section 5.3: Contingent business interruption coverage resulting from Tier-1 vendor supply chain disruptions now requires a mandatory 72-hour waiting period before indemnity payments commence.\u003c/i\u003e\n    \u003c/div\u003e\n    "}, {"color": "#E74C3C", "id": "RuleChange:RC-2026-07_PFASPollutionExclusion.txt", "label": "RC-2026-07_PFASPollutionExclusion", "shape": "dot", "size": 26, "title": "\n    \u003cdiv style=\"font-family: Arial, sans-serif; width: 320px; padding: 6px;\"\u003e\n        \u003cb style=\"font-size: 14px; color:#E74C3C\"\u003e[RULECHANGE]\u003c/b\u003e\u003cbr\u003e\n        \u003cb\u003eFile:\u003c/b\u003e RC-2026-07_PFASPollutionExclusion.txt\u003cbr\u003e\n        \u003cb\u003eImpact / Risk:\u003c/b\u003e Critical\u003cbr\u003e\n        \u003chr style=\"border: 0.5px solid #ccc; margin: 6px 0;\"\u003e\n        \u003cb\u003eContent Excerpt:\u003c/b\u003e\u003cbr\u003e\n        \u003ci style=\"font-size: 11px; color: #555;\"\u003eRULE CHANGE NOTICE RC-2026-07 (PFAS \u0026 CONTAMINANT EXCLUSION):\u003cbr\u003e        Amending Clause 18.2: Comprehensive general liability policies shall completely exclude coverage for bodily injury or property damage arising out of Per- and Polyfluoroalkyl Substances (PFAS) contamination.\u003c/i\u003e\n    \u003c/div\u003e\n    "}, {"color": "#E74C3C", "id": "RuleChange:RC-2026-08_DOClawsuitDefense.txt", "label": "RC-2026-08_DOClawsuitDefense", "shape": "dot", "size": 26, "title": "\n    \u003cdiv style=\"font-family: Arial, sans-serif; width: 320px; padding: 6px;\"\u003e\n        \u003cb style=\"font-size: 14px; color:#E74C3C\"\u003e[RULECHANGE]\u003c/b\u003e\u003cbr\u003e\n        \u003cb\u003eFile:\u003c/b\u003e RC-2026-08_DOClawsuitDefense.txt\u003cbr\u003e\n        \u003cb\u003eImpact / Risk:\u003c/b\u003e Medium\u003cbr\u003e\n        \u003chr style=\"border: 0.5px solid #ccc; margin: 6px 0;\"\u003e\n        \u003cb\u003eContent Excerpt:\u003c/b\u003e\u003cbr\u003e\n        \u003ci style=\"font-size: 11px; color: #555;\"\u003eRULE CHANGE NOTICE RC-2026-08 (D\u0026O REGULATORY DEFENSE SUB-LIMITS):\u003cbr\u003e        Referencing Article 3: Defense costs for regulatory enforcement actions and SEC investigations are now subject to a strict $1,000,000 sub-limit per policy period.\u003c/i\u003e\n    \u003c/div\u003e\n    "}, {"color": "#E74C3C", "id": "RuleChange:RC-2026-09_CargoColdChain.txt", "label": "RC-2026-09_CargoColdChain", "shape": "dot", "size": 26, "title": "\n    \u003cdiv style=\"font-family: Arial, sans-serif; width: 320px; padding: 6px;\"\u003e\n        \u003cb style=\"font-size: 14px; color:#E74C3C\"\u003e[RULECHANGE]\u003c/b\u003e\u003cbr\u003e\n        \u003cb\u003eFile:\u003c/b\u003e RC-2026-09_CargoColdChain.txt\u003cbr\u003e\n        \u003cb\u003eImpact / Risk:\u003c/b\u003e High\u003cbr\u003e\n        \u003chr style=\"border: 0.5px solid #ccc; margin: 6px 0;\"\u003e\n        \u003cb\u003eContent Excerpt:\u003c/b\u003e\u003cbr\u003e\n        \u003ci style=\"font-size: 11px; color: #555;\"\u003eRULE CHANGE NOTICE RC-2026-09 (MARITIME COLD CHAIN TEMPERATURE MONITORS):\u003cbr\u003e        Under Section 11.4, temperature-sensitive refrigerated cargo claims require continuous IoT data logs proving temperatures did not exceed 4 degrees Celsius during transport.\u003c/i\u003e\n    \u003c/div\u003e\n    "}, {"color": "#E74C3C", "id": "RuleChange:RC-2026-10_ProductRecallDeductible.txt", "label": "RC-2026-10_ProductRecallDeductible", "shape": "dot", "size": 26, "title": "\n    \u003cdiv style=\"font-family: Arial, sans-serif; width: 320px; padding: 6px;\"\u003e\n        \u003cb style=\"font-size: 14px; color:#E74C3C\"\u003e[RULECHANGE]\u003c/b\u003e\u003cbr\u003e\n        \u003cb\u003eFile:\u003c/b\u003e RC-2026-10_ProductRecallDeductible.txt\u003cbr\u003e\n        \u003cb\u003eImpact / Risk:\u003c/b\u003e Medium\u003cbr\u003e\n        \u003chr style=\"border: 0.5px solid #ccc; margin: 6px 0;\"\u003e\n        \u003cb\u003eContent Excerpt:\u003c/b\u003e\u003cbr\u003e\n        \u003ci style=\"font-size: 11px; color: #555;\"\u003eRULE CHANGE NOTICE RC-2026-10 (PRODUCT RECALL MANDATORY DEDUCTIBLE):\u003cbr\u003e        Amending Paragraph 22.1: First-party product recall expense coverage now carries a minimum mandatory deductible of $50,000 or 10% of total recall expenses, whichever is greater.\u003c/i\u003e\n    \u003c/div\u003e\n    "}, {"color": "#2980B9", "id": "ActualPolicy:POL-PROP-2024_CommercialProperty.txt", "label": "POL-PROP-2024_CommercialProperty", "shape": "dot", "size": 20, "title": "\n    \u003cdiv style=\"font-family: Arial, sans-serif; width: 320px; padding: 6px;\"\u003e\n        \u003cb style=\"font-size: 14px; color:#2980B9\"\u003e[ACTUALPOLICY]\u003c/b\u003e\u003cbr\u003e\n        \u003cb\u003eFile:\u003c/b\u003e POL-PROP-2024_CommercialProperty.txt\u003cbr\u003e\n        \u003cb\u003eImpact / Risk:\u003c/b\u003e N/A\u003cbr\u003e\n        \u003chr style=\"border: 0.5px solid #ccc; margin: 6px 0;\"\u003e\n        \u003cb\u003eContent Excerpt:\u003c/b\u003e\u003cbr\u003e\n        \u003ci style=\"font-size: 11px; color: #555;\"\u003eCOMMERCIAL PROPERTY MASTER POLICY:\u003cbr\u003e        Section 12.1 - Water Damage \u0026 Structural Overhead Coverage:\u003cbr\u003e        Covers internal plumbing bursts up to $250,000 per occurrence. \u003cbr\u003e        Clause 4.2 - Inspection Terms: Policyholders must maintain semi-annual plumbing maintenance logs.\u003cbr\u003e        Article 7 - Structural Additions: Roof replacements are covered under Full Replacement Cost without depreciation deduction.\u003c/i\u003e\n    \u003c/div\u003e\n    "}, {"color": "#2980B9", "id": "ActualPolicy:POL-AUTO-2025_FleetAuto.txt", "label": "POL-AUTO-2025_FleetAuto", "shape": "dot", "size": 20, "title": "\n    \u003cdiv style=\"font-family: Arial, sans-serif; width: 320px; padding: 6px;\"\u003e\n        \u003cb style=\"font-size: 14px; color:#2980B9\"\u003e[ACTUALPOLICY]\u003c/b\u003e\u003cbr\u003e\n        \u003cb\u003eFile:\u003c/b\u003e POL-AUTO-2025_FleetAuto.txt\u003cbr\u003e\n        \u003cb\u003eImpact / Risk:\u003c/b\u003e N/A\u003cbr\u003e\n        \u003chr style=\"border: 0.5px solid #ccc; margin: 6px 0;\"\u003e\n        \u003cb\u003eContent Excerpt:\u003c/b\u003e\u003cbr\u003e\n        \u003ci style=\"font-size: 11px; color: #555;\"\u003eCOMMERCIAL FLEET AUTO POLICY:\u003cbr\u003e        Section 8.1 - Emergency Roadside Recovery \u0026 Towing:\u003cbr\u003e        Policyholders are fully covered for roadside recovery up to $500 per event, including third-party towing providers chosen by the driver.\u003c/i\u003e\n    \u003c/div\u003e\n    "}, {"color": "#2980B9", "id": "ActualPolicy:POL-CYBER-2025_EnterpriseTech.txt", "label": "POL-CYBER-2025_EnterpriseTech", "shape": "dot", "size": 20, "title": "\n    \u003cdiv style=\"font-family: Arial, sans-serif; width: 320px; padding: 6px;\"\u003e\n        \u003cb style=\"font-size: 14px; color:#2980B9\"\u003e[ACTUALPOLICY]\u003c/b\u003e\u003cbr\u003e\n        \u003cb\u003eFile:\u003c/b\u003e POL-CYBER-2025_EnterpriseTech.txt\u003cbr\u003e\n        \u003cb\u003eImpact / Risk:\u003c/b\u003e N/A\u003cbr\u003e\n        \u003chr style=\"border: 0.5px solid #ccc; margin: 6px 0;\"\u003e\n        \u003cb\u003eContent Excerpt:\u003c/b\u003e\u003cbr\u003e\n        \u003ci style=\"font-size: 11px; color: #555;\"\u003eENTERPRISE CYBER LIABILITY POLICY:\u003cbr\u003e        Paragraph 15.3 - Security Safeguards \u0026 Identity Access Controls:\u003cbr\u003e        Insured entity must maintain commercial-grade identity access management, software MFA, and annual internal vulnerability assessments.\u003cbr\u003e        Excludes ransomware payout coverage if fundamental access policies are unverified.\u003c/i\u003e\n    \u003c/div\u003e\n    "}, {"color": "#2980B9", "id": "ActualPolicy:POL-HLTH-2023_GroupHealth.txt", "label": "POL-HLTH-2023_GroupHealth", "shape": "dot", "size": 20, "title": "\n    \u003cdiv style=\"font-family: Arial, sans-serif; width: 320px; padding: 6px;\"\u003e\n        \u003cb style=\"font-size: 14px; color:#2980B9\"\u003e[ACTUALPOLICY]\u003c/b\u003e\u003cbr\u003e\n        \u003cb\u003eFile:\u003c/b\u003e POL-HLTH-2023_GroupHealth.txt\u003cbr\u003e\n        \u003cb\u003eImpact / Risk:\u003c/b\u003e N/A\u003cbr\u003e\n        \u003chr style=\"border: 0.5px solid #ccc; margin: 6px 0;\"\u003e\n        \u003cb\u003eContent Excerpt:\u003c/b\u003e\u003cbr\u003e\n        \u003ci style=\"font-size: 11px; color: #555;\"\u003eGROUP HEALTH COMPREHENSIVE PLAN:\u003cbr\u003e        Clause 9.4 - Pre-Existing Condition Exclusions:\u003cbr\u003e        Pre-existing conditions including cardiac and diabetic ailments are subject to a strict 24-month waiting window from enrollment date.\u003cbr\u003e        Co-pay rate is fixed at 15% in-network.\u003c/i\u003e\n    \u003c/div\u003e\n    "}, {"color": "#2980B9", "id": "ActualPolicy:POL-EXEC-2025_DirectorsLiability.txt", "label": "POL-EXEC-2025_DirectorsLiability", "shape": "dot", "size": 20, "title": "\n    \u003cdiv style=\"font-family: Arial, sans-serif; width: 320px; padding: 6px;\"\u003e\n        \u003cb style=\"font-size: 14px; color:#2980B9\"\u003e[ACTUALPOLICY]\u003c/b\u003e\u003cbr\u003e\n        \u003cb\u003eFile:\u003c/b\u003e POL-EXEC-2025_DirectorsLiability.txt\u003cbr\u003e\n        \u003cb\u003eImpact / Risk:\u003c/b\u003e N/A\u003cbr\u003e\n        \u003chr style=\"border: 0.5px solid #ccc; margin: 6px 0;\"\u003e\n        \u003cb\u003eContent Excerpt:\u003c/b\u003e\u003cbr\u003e\n        \u003ci style=\"font-size: 11px; color: #555;\"\u003eDIRECTORS \u0026 OFFICERS LIABILITY POLICY:\u003cbr\u003e        Article 3 - Regulatory Non-Compliance \u0026 Legal Defense:\u003cbr\u003e        Protects executive officers against shareholder lawsuits, regulatory audit penalties, and corporate governance disputes. Defense costs are covered up to the full aggregate policy limit of $5,000,000.\u003cbr\u003e        Excludes coverage for deliberate fraudulent activity or unapproved policy modifications.\u003c/i\u003e\n    \u003c/div\u003e\n    "}, {"color": "#2980B9", "id": "ActualPolicy:POL-BIZ-2024_SupplyChainInterruption.txt", "label": "POL-BIZ-2024_SupplyChainInterruption", "shape": "dot", "size": 20, "title": "\n    \u003cdiv style=\"font-family: Arial, sans-serif; width: 320px; padding: 6px;\"\u003e\n        \u003cb style=\"font-size: 14px; color:#2980B9\"\u003e[ACTUALPOLICY]\u003c/b\u003e\u003cbr\u003e\n        \u003cb\u003eFile:\u003c/b\u003e POL-BIZ-2024_SupplyChainInterruption.txt\u003cbr\u003e\n        \u003cb\u003eImpact / Risk:\u003c/b\u003e N/A\u003cbr\u003e\n        \u003chr style=\"border: 0.5px solid #ccc; margin: 6px 0;\"\u003e\n        \u003cb\u003eContent Excerpt:\u003c/b\u003e\u003cbr\u003e\n        \u003ci style=\"font-size: 11px; color: #555;\"\u003eBUSINESS INTERRUPTION \u0026 CONTINGENT RISK POLICY:\u003cbr\u003e        Section 5.3 - Vendor Supply Chain Downtime:\u003cbr\u003e        Indemnifies lost net operating income following vendor operational shutdown. Indemnity payments begin immediately after a 24-hour elimination period.\u003c/i\u003e\n    \u003c/div\u003e\n    "}, {"color": "#2980B9", "id": "ActualPolicy:POL-ENV-2025_GeneralPollution.txt", "label": "POL-ENV-2025_GeneralPollution", "shape": "dot", "size": 20, "title": "\n    \u003cdiv style=\"font-family: Arial, sans-serif; width: 320px; padding: 6px;\"\u003e\n        \u003cb style=\"font-size: 14px; color:#2980B9\"\u003e[ACTUALPOLICY]\u003c/b\u003e\u003cbr\u003e\n        \u003cb\u003eFile:\u003c/b\u003e POL-ENV-2025_GeneralPollution.txt\u003cbr\u003e\n        \u003cb\u003eImpact / Risk:\u003c/b\u003e N/A\u003cbr\u003e\n        \u003chr style=\"border: 0.5px solid #ccc; margin: 6px 0;\"\u003e\n        \u003cb\u003eContent Excerpt:\u003c/b\u003e\u003c
